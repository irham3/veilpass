services:
  e2e-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: veilpass
      POSTGRES_USER: veilpass
      POSTGRES_PASSWORD: veilpass
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veilpass -d veilpass"]
      interval: 5s
      timeout: 5s
      retries: 12
