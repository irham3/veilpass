name: Verify

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Quality and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Align npm with the committed lockfile
        run: npm install --global npm@11.6.2
      - name: Install frontend dependencies
        run: npm ci
      - name: Install pinned Noir and Barretenberg toolchain
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/refs/heads/main/install | bash
          echo "$HOME/.nargo/bin" >> $GITHUB_PATH
          "$HOME/.nargo/bin/noirup" --version 1.0.0-beta.22
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          echo "$HOME/.bb" >> $GITHUB_PATH
          "$HOME/.bb/bbup" --version 5.0.0-nightly.20260522 --no-modify-path
      - name: Prove and verify Noir membership fixture
        run: npm run proof:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Check website, GitHub, and package documentation contracts
        run: npm run docs:check
      - name: Unit, integration, and coverage gate
        run: npm run test:coverage
      - name: Whole TypeScript source coverage inventory
        run: npm run test:coverage:all
      - name: Dependency security audit
        run: npm run test:security:deps
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage
          if-no-files-found: ignore
      - name: Upload whole-source coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-all-report
          path: frontend/coverage-all
          if-no-files-found: ignore
      - name: Soroban contract tests
        run: npm run contract:test
      - name: Build npm packages and inspect tarballs
        run: npm run pack:check
      - name: Production build
        run: npm run build

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: veilpass
          POSTGRES_USER: veilpass
          POSTGRES_PASSWORD: veilpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veilpass -d veilpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://veilpass:veilpass@localhost:5432/veilpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align npm with the committed lockfile
        run: npm install --global npm@11.6.2
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare isolated browser-test database
        run: npm run db:migrate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: System, security, responsive, and accessibility tests
        run: npm run test:system
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
