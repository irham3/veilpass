name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Pack and publish release artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the pinned npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Verify package contents
        run: npm run pack:check

      - name: Publish public npm packages with provenance
        run: |
          publish_if_missing() {
            local workspace="$1"
            local package_dir="$2"
            local package_name
            local package_version
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"
            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} already exists; skipping immutable publish."
            else
              npm publish --workspace "${workspace}" --access public --provenance
            fi
          }
          publish_if_missing '@veilpass/shared' 'packages/shared'
          publish_if_missing '@veilpass/sdk' 'packages/sdk'
          publish_if_missing '@veilpass/server' 'packages/server'

      - name: Create distributable package archives
        run: |
          npm pack --workspace @veilpass/shared --json
          npm pack --workspace @veilpass/sdk --json
          npm pack --workspace @veilpass/server --json
          sha256sum veilpass-*.tgz > SHA256SUMS

      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --generate-notes veilpass-*.tgz SHA256SUMS
